<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(rgba(0, 25, 55, .45), rgba(0, 25, 55, .45)),
                url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            min-height: 100vh;

        }

        /* ================= HEADER ================= */

        header {

            background: linear-gradient(90deg, #006994, #0096C7, #00B4D8);

            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);

            position: sticky;

            top: 0;

            z-index: 1000;

        }

        nav {

            max-width: 1300px;

            margin: auto;

            display: flex;

            align-items: center;

            padding: 15px 35px;

        }

        nav img {

            width: 75px;

            height: 75px;

            object-fit: cover;

            border-radius: 50%;

            border: 3px solid white;

            transition: .4s;

        }

        nav img:hover {

            transform: rotate(-6deg) scale(1.08);

        }

        nav h1 {

            flex: 1;

            text-align: center;

            color: white;

            font-size: 30px;

            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);

        }

        nav a {

            color: white;

            text-decoration: none;

            margin-left: 25px;

            font-weight: 600;

            transition: .3s;

        }

        nav a:hover {

            color: #FFE066;

        }

        /* ================= PAGE TITLE ================= */

        h2 {

            text-align: center;

            color: white;

            margin-top: 50px;

            margin-bottom: 30px;

            font-size: 38px;

            text-shadow: 3px 3px 10px rgba(0, 0, 0, .35);

        }

        /* ================= TABLE ================= */

        table {

            width: 80%;

            margin: 0 auto 70px;

            border-collapse: collapse;

            border-radius: 18px;

            overflow: hidden;

            background: rgba(255, 255, 255, .93);

            backdrop-filter: blur(10px);

            box-shadow: 0 20px 45px rgba(0, 0, 0, .28);

            animation: fadeUp 1s ease;

        }

        thead {

            background: linear-gradient(90deg, #0077B6, #00B4D8);

            color: white;

        }

        th {

            padding: 18px;

            font-size: 18px;

            letter-spacing: .5px;

        }

        td {

            padding: 16px;

            text-align: center;

            border-bottom: 1px solid #e5e5e5;

            transition: .3s;

        }

        tbody tr:nth-child(even) {

            background: #eef9ff;

        }

        tbody tr:hover {

            background: #CAF0F8;

            transform: scale(1.01);

        }

        /* ================= ANIMATION ================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform: translateY(50px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:900px) {

            nav {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;

            }

            nav h1 {

                width: 100%;

                order: 3;

                font-size: 22px;

            }

            table {

                width: 95%;

            }

            th,
            td {

                padding: 12px;

                font-size: 14px;

            }

        }
    </style>

</head>

<body>
    <header>
        <nav>
            <a href="/Projects/Travel_form/table.html"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnA8hDgKlANlfjonTvqCvN1ex7T762z52xFaKd-9wbPQ8JngAMGcTN0Q1f&s=10"></a>
            <h1>Lay your head and relax</h1>
            <a href="/Projects/Travel_form/form.html" target="_blank">Sample Travel Form</a>
            <a href="/Projects/Travel_form/video.html" target="_blank">Video</a>
            <a href="/Projects/Travel_form/list.html" target="_blank">Sample List</a>
            <a href="/practice.html">Practice</a>
        </nav>



    </header>

                <th>Name</th>

            </tr>
        </thead>
        <tbody>

                <td>aditi</td>

            </tr>

            </tr>
            <tr>
                <td>pankaj</td>

            </tr>

        </tbody>
    </table>

</body>

</html>
